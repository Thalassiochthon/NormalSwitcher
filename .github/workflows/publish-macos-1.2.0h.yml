name: Publish verified macOS 1.2.0h
on:
  push:
    branches: [release/macos-1.2.0h]
permissions:
  contents: write
concurrency:
  group: normalswitcher-macos-beta-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and publish the signed disk image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/NormalSwitcher-1.2.0h.dmg"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/8b706e51cbb9cd96250a3f3d8e8eb8219981071f" --jq .content | base64 -d > "$asset"
          printf '%s  %s\n' 'cfd8ca7269c6e9af068c1db9b74c0ce72846519298cf024a1a3e7882ea80d20d' "$asset" | sha256sum -c -
          printf '%s\n' '{"version":"1.2.0h","build":"84","dev":"","notes":"Повторный поиск активного поля через Accessibility и поддержка редактируемых контейнеров."}' > "$RUNNER_TEMP/beta.json"
          git checkout --detach 5246258e967f720e26c26a28c253c207f7954a4c
          python3 scripts/publish_macos_beta.py "$asset" --manifest "$RUNNER_TEMP/beta.json"
